# GitHub Actions workflow for building BreakTimer
# Triggered on every push and pull request to ensure the project builds correctly
name: Build BreakTimer

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [published]

jobs:
  build:
    # Run on Windows environment since BreakTimer is a Windows Forms application
    runs-on: windows-latest
    
    steps:
    # Check out the repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # Set up .NET 8 SDK for building the project
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Restore NuGet dependencies
    - name: Restore NuGet packages
      run: dotnet restore

    # Build the project in Release configuration
    - name: Build BreakTimer
      run: dotnet build --configuration Release --no-restore

    # Run any unit tests if they exist
    - name: Run tests (if available)
      run: dotnet test --configuration Release --no-build --verbosity normal
      continue-on-error: true

    # Publish the application for release distribution
    - name: Publish Release build
      run: dotnet publish --configuration Release --output ./publish

    # Upload build artifacts for debugging and distribution
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: BreakTimer-Release
        path: ./publish
        retention-days: 30

    # Package release asset when a GitHub Release is published
    - name: Package Release Asset
      if: github.event_name == 'release'
      run: |
        $zipPath = "./BreakTimer-${{ github.ref_name }}-win-x64.zip"
        Compress-Archive -Path ./publish/* -DestinationPath $zipPath
        Write-Host "Release package created: $zipPath"

    - name: Upload Release Asset
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./BreakTimer-${{ github.ref_name }}-win-x64.zip
        asset_name: BreakTimer-${{ github.ref_name }}-win-x64.zip
        asset_content_type: application/zip

    # Display build summary
    - name: Build Summary
      if: always()
      run: |
        Write-Host "========================================" -ForegroundColor Green
        Write-Host "Build completed successfully!" -ForegroundColor Green
        Write-Host "========================================" -ForegroundColor Green
        Write-Host ""
        Write-Host "Build Artifacts:" -ForegroundColor Cyan
        Write-Host "  Location: ./publish" -ForegroundColor Yellow
        Write-Host ""
        Write-Host "Project: BreakTimer (.NET 8 Windows Forms)" -ForegroundColor Yellow
